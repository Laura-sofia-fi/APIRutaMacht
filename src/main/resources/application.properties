spring.application.name=RutaMacht
server.port=8081
api.pasajeros.url=${API_PASAJEROS_URL:http://localhost:8082}
spring.data.mongodb.uri=${RUTAMACHT_MONGODB_URI:mongodb://localhost:27017/rutamacht}

# Login con Google (reservas). Define la variable de entorno GOOGLE_CLIENT_ID.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Swagger UI: http://localhost:8081/swagger-ui.html  |  JSON: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
