<div class="wrap">
  <header>
    <div class="brand">Ruta<span>Macht</span></div>
    <div class="carretera">
      <svg class="carrito" viewBox="0 0 140 64" width="120" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- líneas de velocidad -->
        <g class="velocidad" stroke="var(--accent)" stroke-width="3.2">

          <!-- línea inferior con remolino -->
          <path d="M66 47C52 47 38 48 31 53C26 57 29 62 34 61C38 60 38 55 35 55"/>
        </g>

        <svg class="carrito" viewBox="0 0 190 64" width="190" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- líneas de velocidad -->
          <g class="velocidad" stroke="var(--accent)" stroke-width="3">
            <path d="M2 30H18"/>
            <path d="M8 40H22"/>
            <path d="M4 50H16"/>
          </g>

          <g class="carro" transform="translate(26 0)">
            <g transform="translate(0 6)">
              <!-- asientos (detrás de la carrocería) -->
              <path d="M33 31Q33 21 40 21Q45 21 45 31Z" fill="#3A2A26"/>
              <path d="M49 31Q49 22 56 22Q60 22 60 31Z" fill="#3A2A26"/>

              <!-- parabrisas inclinado -->
              <path d="M63 16L68 16L80 31L72 31Z" fill="#3A2A26"/>
              <path d="M66 19L69 19L75 28L71 28Z" fill="#CFE8F0" opacity=".7"/>

              <!-- carrocería -->
              <path d="M4 44Q2 37 8 34L14 31Q32 28 52 30L72 31Q92 29 101 34Q109 37 109 43V46Q109 48 106 48H8Q4 48 4 44Z" fill="var(--accent)"/>
              <!-- brillo -->
              <path d="M16 32Q34 30 52 31.5" stroke="#F4776B" stroke-width="2"/>
              <!-- línea de la puerta y manija -->
              <path d="M58 33Q56 40 58 46" stroke="#A8261C" stroke-width="1.5"/>
              <path d="M62 36H67" stroke="#A8261C" stroke-width="1.5"/>
              <!-- luces -->
              <ellipse cx="104" cy="38" rx="3" ry="2.2" fill="#FFF6EC"/>
              <ellipse cx="7" cy="38" rx="2" ry="3" fill="#8E1D15"/>
              <rect x="105" y="43" width="5" height="3" rx="1.5" fill="#3A2A26"/>

              <!-- huecos de rueda -->
              <path d="M16 48A12 12 0 0 1 40 48Z" fill="#6E1510"/>
              <path d="M74 48A12 12 0 0 1 98 48Z" fill="#6E1510"/>

              <!-- ruedas -->
              <g class="rueda" style="transform-box:fill-box;transform-origin:center">
                <circle cx="28" cy="45.5" r="8.5" fill="#2B2B2B"/>
                <circle cx="28" cy="45.5" r="4.8" fill="#A0A0A0"/>
                <path d="M28 41.5V49.5M24 45.5H32" stroke="#6B6B6B" stroke-width="1.4"/>
              </g>
              <g class="rueda" style="transform-box:fill-box;transform-origin:center">
                <circle cx="86" cy="45.5" r="8.5" fill="#2B2B2B"/>
                <circle cx="86" cy="45.5" r="4.8" fill="#A0A0A0"/>
                <path d="M86 41.5V49.5M82 45.5H90" stroke="#6B6B6B" stroke-width="1.4"/>
              </g>
            </g>
          </g>
        </svg>
      </svg>
    </div>

    <div id="status-pill">
      <span class="dot" [class.up]="apiArriba === true" [class.down]="apiArriba === false"></span>
      <span>{{ apiArriba === null ? 'Comprobando API…' : (apiArriba ? 'API en línea' : 'API no disponible') }}</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab" [class.active]="tab === 'conductores'" (click)="tab = 'conductores'">Conductores</button>
    <button class="tab" [class.active]="tab === 'vehiculos'" (click)="tab = 'vehiculos'">Vehículos</button>
    <button class="tab" [class.active]="tab === 'pasajeros'" (click)="tab = 'pasajeros'">Pasajeros</button>
  </div>

  <app-conductores *ngIf="tab === 'conductores'"></app-conductores>
  <app-vehiculos *ngIf="tab === 'vehiculos'"></app-vehiculos>
  <app-pasajeros *ngIf="tab === 'pasajeros'"></app-pasajeros>
</div>

<div class="toast-wrap">
  <div class="toast" [class.err]="t.err" *ngFor="let t of toastService.toasts()">{{ t.text }}</div>
</div>
